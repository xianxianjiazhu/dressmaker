<title>洋裝轉盤</title>

<style>
/* Layout: combo bar on top (all-four spin + result), four wheels in a 2x2 grid below, colour settings at the end */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#1b2440; --muted:#5d6784; --line:#d5dbe8;
  --accent:#f2a516; --accent-ink:#2a1c00; --pointer:#f2a516;
  --display:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111627; --surface:#1a2136; --ink:#e8ecf7; --muted:#9aa4c2; --line:#2c3552;
  --accent:#f5b83b; --accent-ink:#2a1c00; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111627; --surface:#1a2136; --ink:#e8ecf7; --muted:#9aa4c2; --line:#2c3552;
  --accent:#f5b83b; --accent-ink:#2a1c00; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.6}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
button{font:inherit;cursor:pointer;border-radius:10px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* combo bar */
.combo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:760px){.combo{grid-template-columns:minmax(0,1fr)}}
.spin-all{background:var(--accent);color:var(--accent-ink);border:0;font-family:var(--display);font-weight:700;font-size:22px;padding:14px 28px;letter-spacing:.08em;white-space:nowrap}
.spin-all:disabled,.spin-one:disabled{opacity:.5;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;gap:10px;align-items:center;min-width:0}
.slot .ph{width:56px;height:56px;flex:none;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.slot .ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.slot .t{min-width:0}
.slot .k{font-size:12px;color:var(--muted);letter-spacing:.1em}
.slot .v{font-weight:500;line-height:1.3;word-break:break-word;font-size:14px}
.hist{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}

/* wheels */
.wheels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.wheels{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.2}
.card .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.spin-one{margin-left:auto;background:var(--ink);color:var(--bg);border:0;padding:6px 16px;font-weight:500}
.wheel-box{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
.wheel-box canvas{width:100%;height:100%;display:block;cursor:pointer}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--pointer);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.live{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px;min-height:84px}
.live .ph{width:72px;height:72px;flex:none;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.live .ph img{width:100%;height:100%;object-fit:contain}
.live .k{font-size:12px;color:var(--muted);letter-spacing:.1em}
.live .v{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25;word-break:break-word}
.live.won .k{color:var(--ink)}
.live.won .ph{box-shadow:0 0 0 3px var(--accent);border-color:transparent}

/* colour settings */
.colors{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.colors summary{cursor:pointer;padding:12px 16px;font-family:var(--display);font-size:18px;font-weight:700}
.cbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.clabel{font-size:13px;color:var(--muted);min-width:4em}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:1px solid var(--line);padding:6px 8px;color:var(--ink);font-size:12px}
.preset.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.preset .dots{display:flex}
.preset .dots i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:2px solid var(--surface)}
.preset .dots i:first-child{margin-left:0}
input[type=color]{width:40px;height:32px;padding:0 2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.en{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);line-height:1.3;letter-spacing:0}
.picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.picker select{flex:1;min-width:0;max-width:100%}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint b{color:var(--ink);font-weight:500}
.card.locked .wheel-box{opacity:.4}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>洋裝轉盤</h1>
    <p class="sub">先轉出上衣，再從能搭這件上衣的袖子和領子裡轉，裙襬每件都能配。</p>
  </div>

  <section class="combo" aria-live="polite">
    <button class="spin-all" id="spinAll">四個一起轉</button>
    <div class="slots" id="slots"></div>
    <p class="hist" id="hist" hidden></p>
  </section>

  <section class="wheels" id="wheels"></section>

  <details class="colors">
    <summary>轉盤顏色</summary>
    <div class="cbody">
      <div class="crow">
        <span class="clabel">套用到</span>
        <select id="target" aria-label="要調整哪個轉盤">
          <option value="all">全部轉盤</option>
        </select>
      </div>
      <div class="crow">
        <span class="clabel">配色組合</span>
        <div class="presets" id="presets"></div>
      </div>
      <div class="crow">
        <span class="clabel">外框</span><input type="color" id="rimColor" aria-label="外框顏色">
        <span class="clabel">分隔線</span><input type="color" id="lineColor" aria-label="分隔線顏色">
        <span class="clabel">指針</span><input type="color" id="pointerColor" aria-label="指針顏色">
      </div>
      <p class="note">指針顏色是四個轉盤共用的。設定只存在這個瀏覽器。</p>
    </div>
  </details>
</div>

(function(){

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){settings.pointer=s.pointer||settings.pointer;for(const k in s.wheels||{})if(settings.wheels[k])Object.assign(settings.wheels[k],s.wheels[k])}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(settings))}catch(e){}};

const pretty=s=>s.split('-').map(w=>w==='v'?'V':w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const PLACEHOLDER='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#eceff5"/></svg>');

const byKey={};

let drawQueued=new Set();
function queueDraw(W){if(!drawQueued.size)requestAnimationFrame(()=>{drawQueued.forEach(draw);drawQueued.clear()});drawQueued.add(W)}

const DEPENDS={sleeve:true,collar:true};   // 這兩個轉盤要看上衣
let currentTop=null;
const PICKABLE={top:true,skirt:true};   // 有「直接選」選單的轉盤

WHEELS.forEach(W=>{
  byKey[W.key]=W;
  W.all=W.files.trim().split(/\s+/).map(f=>{
    const src=IMAGE_BASE+encodeURIComponent(W.folder)+'/'+encodeURIComponent(f+EXT);
    const it={id:f,name:NAMES[f]||pretty(f),en:pretty(f),src,img:null,ok:false};
    const im=new Image();im.decoding='async';
    im.onload=()=>{it.img=im;it.ok=true;queueDraw(W)};
    im.src=src;return it;
  });
  if(DEPENDS[W.key]){
    W.none={id:null,none:true,name:'不加'+W.name,en:'None',src:NONE_IMG,ok:false};

  $('wheels').appendChild(card);
  Object.assign(W,{card,cv:card.querySelector('canvas'),btn:card.querySelector('.spin-one'),live:card.querySelector('.live'),
    liveImg:card.querySelector('.live img'),liveName:card.querySelector('.live .v'),liveK:card.querySelector('.live .k'),
    count:card.querySelector('.n'),hint:card.querySelector('.hint'),select:card.querySelector('select')});
  W.ctx=W.cv.getContext('2d');
  W.btn.onclick=()=>spinOne(W);W.cv.onclick=()=>spinOne(W);
  if(W.select)W.select.onchange=()=>{const it=W.all.find(x=>x.id===W.select.value);if(!it||W.spinning)return;if(W.key==='top')chooseTop(it,true);else choose(W,it)};
  const opt=document.createElement('option');opt.value=W.key;opt.textContent=W.name;$('target').appendChild(opt);
  const slot=document.createElement('div');slot.className='slot';
  slot.innerHTML=`<div class="ph">?</div><div class="t"><div class="k">${W.name}</div><div class="v">—</div></div>`;
  $('slots').appendChild(slot);W.slot=slot;
});

function setCount(W){W.count.textContent=DEPENDS[W.key]&&currentTop?`可選 ${W.items.length} 項（含不加）`:`${W.all.length} 款`}

/* 依上衣篩選袖子、領子 */
function applyTop(top){
  currentTop=top;
  ['sleeve','collar'].forEach(k=>{
    const W=byKey[k];if(!W)return;
    const rule=COMPAT[top.id]?.[k];
    const allowed=rule===undefined||rule==='all'?W.all:W.all.filter(it=>rule.includes(it.id));
    W.items=[W.none,...allowed];
    W.pick=null;W.lastIdx=-1;W.live.classList.remove('won');
    W.card.classList.remove('locked');
    const only=W.items.length===1;
    W.hint.innerHTML=only?`<b>${top.name}</b> 不配${W.name}。`:
      (allowed.length===W.all.length?`<b>${top.name}</b> 可以配所有${W.name}。`:`<b>${top.name}</b> 只能配這 ${allowed.length} 款${W.name}，或不加。`);
    W.btn.disabled=only;
    setCount(W);
    if(only){W.rot=0;W.pick=W.none;setSlot(W);W.live.classList.add('won');W.liveK.textContent='結果'}
    else resetSlot(W);
    draw(W);
  });
}
function lockDependents(){
  ['sleeve','collar'].forEach(k=>{const W=byKey[k];if(!W)return;
    W.card.classList.add('locked');W.btn.disabled=true;W.hint.innerHTML='先轉出或選好上衣，這裡才會列出能搭配的款式。';setCount(W);draw(W)});
}
/* 直接選：把轉盤轉到那一格 */
function choose(W,it){
  const i=W.items.indexOf(it);W.rot=-i*(Math.PI*2/W.items.length);W.lastIdx=-1;W.pick=it;draw(W);
  W.live.classList.add('won');W.liveK.textContent='選定';setSlot(W);
}
function chooseTop(it,manual){
  const W=byKey.top;W.pick=it;
  if(manual){const i=W.items.indexOf(it);W.rot=-i*(Math.PI*2/W.items.length);W.lastIdx=-1;draw(W);W.live.classList.add('won');W.liveK.textContent='選定'}
  if(W.select)W.select.value=it.id;
  setSlot(W);applyTop(it);
}

function textOn(hex){const v=parseInt(hex.slice(1),16);const r=v>>16&255,g=v>>8&255,b=v&255;return (r*299+g*587+b*114)/1000>150?'#1b1b1b':'#ffffff'}

function draw(W){
  const ctx=W.ctx,N=W.cv.width,C=N/2,R=C-12,n=W.items.length,a=Math.PI*2/n,st=settings.wheels[W.key];
  const pal=PRESETS[st.preset]||PRESETS['繽紛'];
  ctx.clearRect(0,0,N,N);
  ctx.save();ctx.translate(C,C);
  ctx.beginPath();ctx.arc(0,0,R+10,0,Math.PI*2);ctx.fillStyle=st.rim;ctx.fill();
  ctx.rotate(W.rot);
  const s=n===1?R*0.7:Math.min(R*0.42,0.88*2*(R*0.86)*Math.sin(a/2));
  const rho=n===1?0:R-s/2-10;
  W.items.forEach((it,i)=>{
    const s0=-Math.PI/2+i*a-a/2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,s0,s0+a);ctx.closePath();
    ctx.fillStyle=it.none?'#e9ecf3':pal[i%pal.length];ctx.fill();
    ctx.save();ctx.rotate(s0+a/2+Math.PI/2);
    ctx.beginPath();ctx.arc(0,-rho,s/2,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill();
    if(it.none){
      ctx.strokeStyle='#8a93ad';ctx.lineWidth=Math.max(2,s*0.06);
      ctx.beginPath();ctx.arc(0,-rho,s*0.28,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-s*0.2,-rho+s*0.2);ctx.lineTo(s*0.2,-rho-s*0.2);ctx.stroke();
    }else if(it.ok){ctx.save();ctx.clip();const iw=it.img.width,ih=it.img.height,k=Math.min(s*0.92/iw,s*0.92/ih);
      ctx.drawImage(it.img,-iw*k/2,-rho-ih*k/2,iw*k,ih*k);ctx.restore()}
    ctx.restore();
  });
  if(n>1){ctx.strokeStyle=st.line;ctx.lineWidth=n>40?1.5:3;ctx.beginPath();
    for(let i=0;i<n;i++){const s0=-Math.PI/2+i*a-a/2;ctx.moveTo(0,0);ctx.lineTo(Math.cos(s0)*R,Math.sin(s0)*R)}ctx.stroke()}
  ctx.restore();
  if(n>1){
    ctx.beginPath();ctx.arc(C,C,52,0,Math.PI*2);ctx.fillStyle=st.rim;ctx.fill();
    ctx.beginPath();ctx.arc(C,C,41,0,Math.PI*2);ctx.fillStyle=settings.pointer;ctx.fill();
    ctx.fillStyle=textOn(settings.pointer);ctx.font='700 30px "LXGW WenKai TC","Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(W.name.slice(0,1),C,C+2);
  }
  updateLive(W);
}
function idxAt(W){const n=W.items.length,a=Math.PI*2/n;return ((Math.round(-W.rot/a)%n)+n)%n}
function nameHTML(it){return `${it.name}<span class="en">${it.en}</span>`}
function updateLive(W){
  const i=idxAt(W);if(i===W.lastIdx)return;W.lastIdx=i;const it=W.items[i];
  W.liveImg.onerror=()=>{W.liveImg.onerror=null;W.liveImg.src=PLACEHOLDER};W.liveImg.src=it.src;W.liveName.innerHTML=nameHTML(it);
}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function spinWheel(W,dur){
  return new Promise(res=>{
    if(W.spinning)return res(null);
    if(W.items.length===1){W.pick=W.items[0];setSlot(W);return res(W.pick)}
    W.spinning=true;W.btn.disabled=true;W.live.classList.remove('won');W.liveK.textContent='轉動中…';
    if(W.select)W.select.disabled=true;
    const n=W.items.length,a=Math.PI*2/n,pick=Math.floor(Math.random()*n);
    const TAU=Math.PI*2,jitter=(Math.random()-.5)*a*.6;
    const target=((-pick*a+jitter)%TAU+TAU)%TAU;
    const cur=((W.rot%TAU)+TAU)%TAU;
    let delta=target-cur;if(delta<0)delta+=TAU;
    const start=W.rot,final=start+delta+TAU*(5+Math.floor(Math.random()*3));
    const d=reduce?500:dur,t0=performance.now(),ease=t=>1-Math.pow(1-t,4);
    (function step(now){const t=Math.min(1,(now-t0)/d);W.rot=start+(final-start)*ease(t);draw(W);
      if(t<1)requestAnimationFrame(step);
      else{W.spinning=false;W.btn.disabled=false;if(W.select)W.select.disabled=false;
        W.pick=W.items[pick];W.live.classList.add('won');W.liveK.textContent='抽中了';if(W.select)W.select.value=W.pick.id||'';
        W.lastIdx=-1;updateLive(W);setSlot(W);res(W.pick)}})(t0);
  });
}
function setSlot(W){
  const it=W.pick;const ph=W.slot.querySelector('.ph');
  ph.innerHTML='';const im=new Image();im.alt='';im.onerror=()=>{im.onerror=null;im.src=PLACEHOLDER};im.src=it.src;ph.appendChild(im);
  W.slot.querySelector('.v').innerHTML=nameHTML(it);
}
function resetSlot(W){W.slot.querySelector('.ph').textContent='?';W.slot.querySelector('.v').textContent='—'}
const anySpinning=()=>WHEELS.some(W=>W.spinning);
async function spinOne(W){
  if(W.spinning||W.card.classList.contains('locked'))return;
  if(W.key==='top'){
    // 換上衣時，袖子和領子要等上衣停下來才能轉
    ['sleeve','collar'].forEach(k=>byKey[k]&&(byKey[k].btn.disabled=true));
    const it=await spinWheel(W,4600);
    if(it)chooseTop(it,false);
  }else spinWheel(W,4200+Math.random()*800);
}
const history=[];
$('spinAll').onclick=async()=>{
  if(anySpinning())return;
  $('spinAll').disabled=true;
  const top=byKey.top;
  ['sleeve','collar'].forEach(k=>byKey[k]&&(byKey[k].btn.disabled=true));
  const skirtP=byKey.skirt?spinWheel(byKey.skirt,5200):Promise.resolve(null);
  const t=await spinWheel(top,3600);
  chooseTop(t,false);
  const rest=await Promise.all([skirtP,...['sleeve','collar'].map((k,i)=>byKey[k]?spinWheel(byKey[k],3000+i*700):null)]);
  $('spinAll').disabled=false;
  const picks=[t,...rest].filter(Boolean);
  history.unshift(picks.map(p=>p.name).join(' ＋ '));
  if(history.length>3)history.length=3;
  if(history.length>1){$('hist').hidden=false;$('hist').textContent='上一組：'+history[1]+(history[2]?'　再上一組：'+history[2]:'')}
};

// 顏色設定
const presetBox=$('presets');
Object.entries(PRESETS).forEach(([name,cols])=>{
  const b=document.createElement('button');b.type='button';b.className='preset';b.dataset.p=name;
  b.innerHTML=`<span class="dots">${cols.slice(0,5).map(c=>`<i style="background:${c}"></i>`).join('')}</span>${name}`;
  b.onclick=()=>{targets().forEach(W=>settings.wheels[W.key].preset=name);save();syncUI();WHEELS.forEach(draw)};
  presetBox.appendChild(b);
});
const targets=()=>{const v=$('target').value;return v==='all'?WHEELS:WHEELS.filter(W=>W.key===v)};
function syncUI(){
  const ts=targets(),st=settings.wheels[ts[0].key];
  const same=k=>ts.every(W=>settings.wheels[W.key][k]===st[k]);
  document.querySelectorAll('.preset').forEach(b=>{const on=same('preset')&&b.dataset.p===st.preset;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  $('rimColor').value=st.rim;$('lineColor').value=st.line;$('pointerColor').value=settings.pointer;
  document.documentElement.style.setProperty('--pointer',settings.pointer);
}
$('target').onchange=syncUI;
$('rimColor').addEventListener('input',e=>{targets().forEach(W=>settings.wheels[W.key].rim=e.target.value);save();WHEELS.forEach(draw)});
$('lineColor').addEventListener('input',e=>{targets().forEach(W=>settings.wheels[W.key].line=e.target.value);save();WHEELS.forEach(draw)});
$('pointerColor').addEventListener('input',e=>{settings.pointer=e.target.value;save();syncUI();WHEELS.forEach(draw)});

syncUI();WHEELS.forEach(W=>{setCount(W);draw(W)});lockDependents();
if(document.fonts)document.fonts.ready.then(()=>WHEELS.forEach(draw));
})();
</script>
